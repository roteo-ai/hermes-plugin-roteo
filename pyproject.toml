[project]
name = "hermes-plugin-roteo"
version = "0.1.0"
description = "Hermes Agent model-provider plugin: Claude via Roteo, driven through the official Claude Code CLI (fork of Nous Research's DirectSDK plugin for Hermes)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# No Python dependencies beyond Hermes core: the transport drives the `claude` executable directly.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: the repo root carries the plugin's __init__.py, which must not be collected as a package.
addopts = "-p no:cacheprovider --import-mode=importlib"
pythonpath = [".", "tests"]
